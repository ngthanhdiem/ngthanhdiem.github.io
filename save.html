<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>SaveVault — Tải video và nhạc</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after {
  box-sizing: border-box; margin: 0; padding: 0;
  -webkit-tap-highlight-color: transparent;
}
:root {
  --bg: #06060a;
  --bg-2: #0a0a12;
  --surface: rgba(255,255,255,0.028);
  --surface-hi: rgba(255,255,255,0.055);
  --border: rgba(255,255,255,0.07);
  --border-hi: rgba(255,255,255,0.15);
  --text: #f5f5f8;
  --text-mid: #9a9aab;
  --text-dim: #55556a;
  --accent: #6366f1;
  --accent-2: #22d3ee;
  --accent-soft: rgba(99,102,241,0.16);
  --danger: #ef4444;
  --radius-lg: 22px; --radius-md: 13px;
  --shadow-lg: 0 28px 72px rgba(0,0,0,0.65);
  --shadow-md: 0 12px 32px rgba(0,0,0,0.4);
  --glow: 0 0 56px rgba(99,102,241,0.4);
  --ease: cubic-bezier(0.4,0,0.2,1);
  --ease-out: cubic-bezier(0.16,1,0.3,1);
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
html, body {
  min-height: 100vh;
  font-family: var(--font-sans);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  touch-action: manipulation; -ms-touch-action: manipulation;
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  overscroll-behavior: none;
}
body { overflow-x: hidden; position: relative; }

/* nền nhiều lớp */
.bg-grid {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(circle at 50% 40%, #000 10%, transparent 70%);
  -webkit-mask-image: radial-gradient(circle at 50% 40%, #000 10%, transparent 70%);
}
.noise {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  opacity: 0.04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
.glow {
  position: fixed; inset: -40%; z-index: 0; pointer-events: none;
  background:
    radial-gradient(circle at 25% 20%, var(--accent-soft), transparent 42%),
    radial-gradient(circle at 78% 65%, rgba(34,211,238,0.09), transparent 42%),
    radial-gradient(circle at 50% 100%, rgba(239,68,68,0.05), transparent 42%);
  filter: blur(90px);
  animation: drift 26s ease-in-out infinite alternate;
  transition: background 1.4s var(--ease);
}
@keyframes drift {
  0%   { transform: translate(0,0) scale(1); }
  100% { transform: translate(3%,-3%) scale(1.1); }
}
body[data-platform="tiktok"]     { --accent: #fe2c55; --accent-2: #25f4ee; --accent-soft: rgba(254,44,85,0.16); --glow: 0 0 56px rgba(254,44,85,0.42); }
body[data-platform="tiktok"] .glow {
  background:
    radial-gradient(circle at 30% 30%, rgba(254,44,85,0.18), transparent 45%),
    radial-gradient(circle at 70% 70%, rgba(37,244,238,0.14), transparent 45%);
}
body[data-platform="soundcloud"] { --accent: #ff5500; --accent-2: #ff8800; --accent-soft: rgba(255,85,0,0.16); --glow: 0 0 56px rgba(255,85,0,0.42); }
body[data-platform="soundcloud"] .glow {
  background: radial-gradient(circle at 50% 40%, rgba(255,85,0,0.22), transparent 55%);
}
body[data-platform="youtube"]    { --accent: #ff0033; --accent-2: #ff4466; --accent-soft: rgba(255,0,51,0.16); --glow: 0 0 56px rgba(255,0,51,0.42); }
body[data-platform="youtube"] .glow {
  background: radial-gradient(circle at 50% 40%, rgba(255,0,51,0.22), transparent 55%);
}
body[data-platform="instagram"]  { --accent: #dc2743; --accent-2: #f09433; --accent-soft: rgba(220,39,67,0.16); --glow: 0 0 56px rgba(220,39,67,0.42); }
body[data-platform="instagram"] .glow {
  background:
    radial-gradient(circle at 30% 30%, rgba(240,148,51,0.22), transparent 45%),
    radial-gradient(circle at 70% 70%, rgba(220,39,67,0.22), transparent 45%);
}
body[data-platform="twitter"]    { --accent: #1d9bf0; --accent-2: #55b8f5; --accent-soft: rgba(29,155,240,0.16); }
body[data-platform="facebook"]   { --accent: #1877f2; --accent-2: #4a9eff; --accent-soft: rgba(24,119,242,0.16); }
body[data-platform="vimeo"]      { --accent: #1ab7ea; --accent-2: #55d0f5; --accent-soft: rgba(26,183,234,0.16); }
body[data-platform="reddit"]     { --accent: #ff4500; --accent-2: #ff7033; --accent-soft: rgba(255,69,0,0.16); }
body[data-platform="twitch"]     { --accent: #9146ff; --accent-2: #b380ff; --accent-soft: rgba(145,70,255,0.16); }
body[data-platform="bilibili"]   { --accent: #00a1d6; --accent-2: #33c1ff; --accent-soft: rgba(0,161,214,0.16); }

.wrap {
  min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  padding: 64px 24px 48px; position: relative; z-index: 1;
}
.brand {
  display: flex; align-items: center; gap: 14px; margin-bottom: 56px;
  opacity: 0; animation: fadeDown 0.9s var(--ease-out) forwards;
}
.brand-mark {
  width: 42px; height: 42px; color: var(--accent);
  filter: drop-shadow(0 0 18px var(--accent-soft));
  transition: color 0.5s var(--ease);
}
.brand-mark rect { fill: var(--accent); transition: fill 0.5s var(--ease); }
.brand-name {
  font-size: 23px; font-weight: 700; letter-spacing: -0.035em;
  background: linear-gradient(135deg, var(--text) 40%, var(--accent) 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  transition: background 0.5s var(--ease);
}

.card {
  width: 100%; max-width: 700px;
  background: var(--surface);
  backdrop-filter: blur(28px) saturate(150%);
  -webkit-backdrop-filter: blur(28px) saturate(150%);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 44px;
  box-shadow: var(--shadow-lg);
  opacity: 0; animation: fadeUp 0.9s 0.1s var(--ease-out) forwards;
  transition: border-color 0.4s var(--ease), box-shadow 0.4s var(--ease);
  position: relative;
  overflow: hidden;
}
.card::before {
  content: "";
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: 0.5;
  transition: opacity 0.4s var(--ease);
}
.card:focus-within {
  border-color: var(--border-hi);
  box-shadow: var(--shadow-lg), var(--glow);
}
.card:focus-within::before { opacity: 1; }

.card-head { margin-bottom: 34px; }
.card-head h1 {
  font-size: 30px; font-weight: 700; letter-spacing: -0.04em;
  margin-bottom: 10px; line-height: 1.1;
}
.card-head p { color: var(--text-mid); font-size: 14px; line-height: 1.6; }

.input-row { display: flex; gap: 10px; position: relative; }
.input-shell { flex: 1; position: relative; }
.input-shell input {
  width: 100%; padding: 19px 50px 19px 50px;
  font-size: 15px; font-family: inherit; color: var(--text);
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  outline: none; transition: all 0.3s var(--ease);
}
.input-shell input::placeholder { color: var(--text-dim); }
.input-shell input:focus {
  border-color: var(--accent);
  background: rgba(0,0,0,0.55);
  box-shadow: 0 0 0 4px var(--accent-soft);
}
.input-icon {
  position: absolute; left: 19px; top: 50%; transform: translateY(-50%);
  width: 18px; height: 18px; color: var(--text-dim);
  pointer-events: none; transition: color 0.3s var(--ease);
}
.input-shell input:focus ~ .input-icon { color: var(--accent); }
.btn-clear {
  position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
  width: 26px; height: 26px;
  background: transparent; border: none;
  color: var(--text-dim); cursor: pointer;
  border-radius: 6px; display: none;
  align-items: center; justify-content: center;
  transition: all 0.2s var(--ease);
}
.btn-clear svg { width: 14px; height: 14px; }
.btn-clear:hover { color: var(--text); background: var(--surface-hi); }
.input-shell.has-value .btn-clear { display: flex; }

.btn-primary {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 0 28px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff; border: none;
  border-radius: var(--radius-md);
  font-size: 14px; font-weight: 600; font-family: inherit;
  letter-spacing: -0.01em; cursor: pointer;
  transition: all 0.3s var(--ease);
  box-shadow: 0 10px 28px var(--accent-soft);
  white-space: nowrap; height: 58px;
  position: relative;
  overflow: hidden;
}
.btn-primary::before {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(135deg, transparent, rgba(255,255,255,0.15), transparent);
  transform: translateX(-100%);
  transition: transform 0.6s var(--ease);
}
.btn-primary:hover:not(:disabled)::before { transform: translateX(100%); }
.btn-primary:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 14px 36px var(--accent-soft);
}
.btn-primary:active:not(:disabled) { transform: translateY(0); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-primary .btn-arrow { width: 16px; height: 16px; }

.platform-info {
  margin-top: 18px; display: inline-flex; align-items: center; gap: 10px;
  padding: 8px 15px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 13px; color: var(--text-mid);
  opacity: 0; transform: translateY(-4px);
  transition: all 0.35s var(--ease);
}
.platform-info.show { opacity: 1; transform: translateY(0); }
.platform-pulse {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 12px var(--accent);
  animation: pulse 1.6s ease-in-out infinite;
  transition: all 0.5s var(--ease);
}
@keyframes pulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.55; transform: scale(1.35); }
}
.platform-label { font-weight: 500; color: var(--text); }

/* EMBED — nhỏ hơn */
.embed {
  max-height: 0; overflow: hidden; opacity: 0; margin-top: 0;
  transition: max-height 0.7s var(--ease), opacity 0.45s var(--ease), margin-top 0.7s var(--ease);
}
.embed.open { max-height: 520px; opacity: 1; margin-top: 28px; }

.embed-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 16px;
  background: rgba(0,0,0,0.55);
  border: 1px solid var(--border); border-bottom: none;
  border-radius: var(--radius-md) var(--radius-md) 0 0;
  font-family: var(--font-mono); font-size: 11.5px;
}
.embed-bar-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.embed-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 10px var(--accent);
  animation: pulse 1.6s ease-in-out infinite;
  flex-shrink: 0; transition: background 0.5s var(--ease);
}
.embed-title { color: var(--text); font-weight: 500; letter-spacing: 0.02em; }
.embed-url {
  color: var(--text-dim); overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; max-width: 280px;
}
.embed-bar-right { display: flex; gap: 6px; align-items: center; }
.embed-close {
  width: 22px; height: 22px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 6px; cursor: pointer;
  display: grid; place-items: center;
  transition: all 0.2s var(--ease);
  margin-left: 8px;
}
.embed-close:hover {
  color: var(--danger);
  border-color: var(--danger);
  background: rgba(239,68,68,0.08);
}
.embed-close svg { width: 12px; height: 12px; }
.win-dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: rgba(255,255,255,0.07);
}

.embed-body {
  position: relative; width: 100%; height: 420px;
  background: #0a0a10;
  border: 1px solid var(--border);
  border-radius: 0 0 var(--radius-md) var(--radius-md);
  overflow: hidden;
}
.embed-body iframe {
  width: 100%; height: 100%; border: none; background: #0a0a10;
}

.sim {
  position: absolute; inset: 0;
  background: rgba(6,6,10,0.98);
  display: none; align-items: center; justify-content: center;
  padding: 40px; z-index: 4;
  transition: opacity 0.5s var(--ease);
}
.sim.show { display: flex; animation: fadeIn 0.4s var(--ease); }
.sim.hide { opacity: 0; pointer-events: none; }
.sim-inner {
  width: 100%; max-width: 300px;
  display: flex; flex-direction: column; align-items: center; gap: 28px;
}
.sim-spinner {
  width: 64px; height: 64px; color: var(--accent);
  animation: spin 1.1s linear infinite;
  transition: color 0.5s var(--ease);
}
.sim-spinner svg { width: 100%; height: 100%; }
@keyframes spin { to { transform: rotate(360deg); } }
.progress {
  width: 100%; height: 3px;
  background: var(--surface-hi); border-radius: 999px;
  overflow: hidden;
}
.progress-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  border-radius: 999px; transition: width 0.25s var(--ease);
  box-shadow: 0 0 14px var(--accent);
}

.platforms {
  margin-top: 44px; display: flex; flex-wrap: wrap; gap: 8px;
  justify-content: center; max-width: 700px;
  opacity: 0; animation: fadeUp 0.9s 0.35s var(--ease-out) forwards;
}
.chip {
  padding: 7px 15px; font-size: 12.5px; font-weight: 500;
  color: var(--text-mid); background: var(--surface);
  border: 1px solid var(--border); border-radius: 999px;
  transition: all 0.3s var(--ease);
}
.chip:hover {
  color: var(--text); border-color: var(--border-hi);
  background: var(--surface-hi);
  transform: translateY(-1px);
}

.footer {
  margin-top: 44px; display: flex; flex-direction: column; align-items: center;
  gap: 12px; font-size: 12.5px; color: var(--text-dim);
  opacity: 0; animation: fadeUp 0.9s 0.5s var(--ease-out) forwards;
}
.footer-links {
  display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
}
.footer-link {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 17px;
  color: var(--text-mid);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  text-decoration: none;
  font-size: 12.5px; font-weight: 500;
  transition: all 0.3s var(--ease);
}
.footer-link:hover {
  color: var(--text); border-color: var(--accent);
  background: var(--accent-soft);
  transform: translateY(-1px);
}
.footer-link svg { width: 14px; height: 14px; flex-shrink: 0; }
.footer-credit { font-size: 11.5px; color: var(--text-dim); opacity: 0.65; letter-spacing: 0.03em; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-24px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

@media (max-width: 640px) {
  .wrap { padding: 36px 16px; }
  .card { padding: 30px 22px; border-radius: 18px; }
  .card-head h1 { font-size: 23px; }
  .input-row { flex-direction: column; }
  .btn-primary {
    justify-content: center; padding: 18px;
    width: 100%; height: auto;
  }
  .embed-body { height: 340px; }
  .embed-url { max-width: 110px; }
}
</style>
</head>
<body data-platform="generic">

<div class="bg-grid"></div>
<div class="noise"></div>
<div class="glow"></div>

<main class="wrap">
  <header class="brand">
    <svg class="brand-mark" viewBox="0 0 40 40" fill="none">
      <rect width="40" height="40" rx="12"/>
      <path d="M20 11v13m0 0l-5-5m5 5l5-5" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12 27h16" stroke="white" stroke-width="2.6" stroke-linecap="round"/>
    </svg>
    <span class="brand-name">SaveVault</span>
  </header>

  <section class="card">
    <div class="card-head">
      <h1>Tải video và nhạc</h1>
      <p>Dán link từ bất kỳ nền tảng nào. Hệ thống tự nhận diện và xử lý.</p>
    </div>

    <div class="input-row">
      <div class="input-shell" id="inputShell">
        <input id="urlInput" type="text" placeholder="Dán link video hoặc nhạc vào đây" autocomplete="off" spellcheck="false" />
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>
        </svg>
        <button class="btn-clear" id="btnClear" title="Xóa" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <button class="btn-primary" id="btnGo" type="button">
        <span class="btn-label">Tải ngay</span>
        <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
    </div>

    <div class="platform-info" id="platformInfo">
      <span class="platform-pulse"></span>
      <span class="platform-label" id="platformLabel">đang chờ link</span>
    </div>

    <div class="embed" id="embed">
      <div class="embed-bar">
        <div class="embed-bar-left">
          <span class="embed-dot"></span>
          <span class="embed-title">cobalt.tools</span>
          <span class="embed-url" id="embedUrl">about:blank</span>
        </div>
        <div class="embed-bar-right">
          <span class="win-dot"></span>
          <span class="win-dot"></span>
          <span class="win-dot"></span>
          <button class="embed-close" id="btnEmbedClose" title="Đóng" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>

      <div class="embed-body">
        <iframe
          id="cobaltFrame"
          src="about:blank"
          sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads allow-modals"
          allow="clipboard-write; clipboard-read"
          referrerpolicy="no-referrer"
        ></iframe>

        <div class="sim" id="sim">
          <div class="sim-inner">
            <div class="sim-spinner">
              <svg viewBox="0 0 50 50">
                <circle cx="25" cy="25" r="20" fill="none" stroke="currentColor" stroke-width="2" opacity="0.1"/>
                <circle cx="25" cy="25" r="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="90 200"/>
              </svg>
            </div>
            <div class="progress">
              <div class="progress-fill" id="simProgress"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="platforms">
    <span class="chip">TikTok</span>
    <span class="chip">SoundCloud</span>
    <span class="chip">YouTube</span>
    <span class="chip">Instagram</span>
    <span class="chip">Twitter / X</span>
    <span class="chip">Facebook</span>
    <span class="chip">Vimeo</span>
    <span class="chip">Reddit</span>
    <span class="chip">Twitch</span>
    <span class="chip">Bilibili</span>
    <span class="chip">và 30+ khác</span>
  </div>

  <footer class="footer">
    <div class="footer-links">
      <a class="footer-link" href="https://t.me/ThanhDiemX" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor">

<script>
/* ═══════════════════════════════════════════
   CONFIG — SỬA Ở ĐÂY
   ═══════════════════════════════════════════ */
// đổi sang URL cobalt self-host của anh
// ví dụ: const COBALT_ORIGIN = "https://cobalt-production-xxxx.up.railway.app";
const COBALT_ORIGIN = "https://cobalt.tools";

/* ═══════════════════════════════════════════
   CHỐNG ZOOM
   ═══════════════════════════════════════════ */
document.addEventListener("gesturestart", e => e.preventDefault(), { passive: false });
document.addEventListener("gesturechange", e => e.preventDefault(), { passive: false });
document.addEventListener("gestureend", e => e.preventDefault(), { passive: false });
let lastTouchEnd = 0;
document.addEventListener("touchend", (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });
document.addEventListener("wheel", (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && ["+","-","=","0"].includes(e.key)) e.preventDefault();
});

/* ═══════════════════════════════════════════
   ÂM THANH
   ═══════════════════════════════════════════ */
let audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
}
function unlockAudio() {
  initAudio();
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
}
function playTap(freq = 720, duration = 0.06, volume = 0.05) {
  initAudio();
  if (!audioCtx) return;
  if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.6, audioCtx.currentTime + duration);
    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration + 0.02);
  } catch (e) {}
}
document.addEventListener("pointerdown", (e) => {
  unlockAudio();
  playTap(e.target.closest("button, a") ? 880 : 620, 0.055, 0.045);
}, { passive: true });
document.addEventListener("touchstart", unlockAudio, { passive: true, once: true });
document.addEventListener("click", unlockAudio, { passive: true, once: true });

/* ═══════════════════════════════════════════
   DOM
   ═══════════════════════════════════════════ */
const input = document.getElementById("urlInput");
const inputShell = document.getElementById("inputShell");
const btnClear = document.getElementById("btnClear");
const btnGo = document.getElementById("btnGo");
const platformInfo = document.getElementById("platformInfo");
const platformLabel = document.getElementById("platformLabel");
const embed = document.getElementById("embed");
const cobaltFrame = document.getElementById("cobaltFrame");
const embedUrl = document.getElementById("embedUrl");
const btnEmbedClose = document.getElementById("btnEmbedClose");
const sim = document.getElementById("sim");
const simProgress = document.getElementById("simProgress");

/* ═══════════════════════════════════════════
   PLATFORM
   ═══════════════════════════════════════════ */
const PLATFORMS = [
  { id: "tiktok",    name: "TikTok",      test: /tiktok\.com|vm\.tiktok|vt\.tiktok/i },
  { id: "soundcloud",name: "SoundCloud",  test: /soundcloud\.com|snd\.sc/i },
  { id: "youtube",   name: "YouTube",     test: /youtube\.com|youtu\.be/i },
  { id: "instagram", name: "Instagram",   test: /instagram\.com|instagr\.am/i },
  { id: "twitter",   name: "Twitter / X", test: /twitter\.com|x\.com|t\.co/i },
  { id: "facebook",  name: "Facebook",    test: /facebook\.com|fb\.watch|fb\.com/i },
  { id: "vimeo",     name: "Vimeo",       test: /vimeo\.com/i },
  { id: "reddit",    name: "Reddit",      test: /reddit\.com|redd\.it/i },
  { id: "twitch",    name: "Twitch",      test: /twitch\.tv/i },
  { id: "bilibili",  name: "Bilibili",    test: /bilibili\.com|b23\.tv/i },
];
function detectPlatform(url) {
  for (const p of PLATFORMS) if (p.test.test(url)) return p;
  return null;
}
function applyTheme(platform) {
  if (!platform) {
    document.body.dataset.platform = "generic";
    platformInfo.classList.remove("show");
    return;
  }
  document.body.dataset.platform = platform.id;
  platformLabel.textContent = platform.name + " detected";
  platformInfo.classList.add("show");
}

/* ═══════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════ */
let busy = false;
let simTimer = null;
let hideTimer = null;
let observer = null;
let currentUrl = null;

/* ═══════════════════════════════════════════
   PROGRESS
   ═══════════════════════════════════════════ */
function runProgress() {
  let p = 0;
  simProgress.style.width = "0%";
  clearInterval(simTimer);
  simTimer = setInterval(() => {
    p = Math.min(100, p + 3);
    simProgress.style.width = p + "%";
    if (p >= 100) clearInterval(simTimer);
  }, 80);
}

/* ═══════════════════════════════════════════
   RESET PANEL (chỉ dùng khi sang link mới)
   ═══════════════════════════════════════════ */
function resetPanel() {
  clearInterval(simTimer);
  clearTimeout(hideTimer);
  simTimer = null; hideTimer = null;

  if (observer) { observer.disconnect(); observer = null; }

  sim.classList.remove("show","hide");
  simProgress.style.width = "0%";
  cobaltFrame.src = "about:blank";
  cobaltFrame.onload = null;
  embedUrl.textContent = "about:blank";
  embed.classList.remove("open");
}

/* ═══════════════════════════════════════════
   HARD RESET (khi xoá link)
   ═══════════════════════════════════════════ */
function hardReset() {
  resetPanel();
  input.value = "";
  inputShell.classList.remove("has-value");
  applyTheme(null);
  busy = false;
  currentUrl = null;
  btnGo.disabled = false;
  btnGo.querySelector(".btn-label").textContent = "Tải ngay";
  try { input.focus(); } catch (e) {}
}

/* ═══════════════════════════════════════════
   AUTO CLICK DOWNLOAD (chỉ khi cùng origin)
   ═══════════════════════════════════════════ */
function tryAutoClickDownload() {
  try {
    const doc = cobaltFrame.contentDocument;
    if (!doc) return;

    try {
      const linkInput = doc.querySelector("#link-area");
      if (linkInput && !linkInput.value) {
        linkInput.value = currentUrl || "";
        linkInput.dispatchEvent(new Event("input", { bubbles: true }));
        linkInput.dispatchEvent(new Event("change", { bubbles: true }));
      }
    } catch (e) {}

    observer = new MutationObserver(() => {
      try {
        const dlBtn = doc.querySelector('#processing-list button[aria-label="download"]');
        if (dlBtn && !dlBtn.dataset.vaultClicked) {
          dlBtn.dataset.vaultClicked = "1";
          dlBtn.click();
        }
      } catch (e) {}
    });
    observer.observe(doc.body, { childList: true, subtree: true });
  } catch (e) {
    // cross-origin
  }
}

/* ═══════════════════════════════════════════
   HANDLE GO
   ═══════════════════════════════════════════ */
async function handleGo() {
  if (busy) return;
  const url = input.value.trim();
  if (!url) { input.focus(); return; }
  if (!/^https?:\/\//i.test(url)) {
    input.focus();
    input.style.borderColor = "var(--danger)";
    setTimeout(() => input.style.borderColor = "", 1200);
    return;
  }

  // nếu link giống link cũ đang mở → không làm gì
  if (currentUrl === url && embed.classList.contains("open")) {
    return;
  }

  // nếu có panel đang mở với link cũ → đóng để mở link mới
  if (embed.classList.contains("open")) {
    resetPanel();
    // đợi animation đóng (700ms) rồi mở lại
    await new Promise(r => setTimeout(r, 750));
  }

  currentUrl = url;

  const platform = detectPlatform(url);
  if (platform) applyTheme(platform);

  busy = true;
  btnGo.disabled = true;
  btnGo.querySelector(".btn-label").textContent = "Đang mở";

  embed.classList.add("open");
  sim.classList.remove("hide");
  sim.classList.add("show");

  let target = COBALT_ORIGIN + "/";
  if (url) target = COBALT_ORIGIN + "/#" + encodeURIComponent(url);
  embedUrl.textContent = target;

  cobaltFrame.onload = () => { tryAutoClickDownload(); };
  cobaltFrame.src = target;

  try { await navigator.clipboard.writeText(url); } catch {}

  runProgress();

  hideTimer = setTimeout(() => {
    sim.classList.add("hide");
    setTimeout(() => {
      sim.classList.remove("show","hide");
      simProgress.style.width = "0%";
    }, 500);

    busy = false;
    btnGo.disabled = false;
    btnGo.querySelector(".btn-label").textContent = "Tải ngay";
  }, 3000);
}

/* ═══════════════════════════════════════════
   EVENTS
   ═══════════════════════════════════════════ */
let detectTimer = null;
input.addEventListener("input", () => {
  inputShell.classList.toggle("has-value", input.value.length > 0);
  clearTimeout(detectTimer);
  detectTimer = setTimeout(() => {
    const url = input.value.trim();
    if (!url) { applyTheme(null); return; }
    applyTheme(detectPlatform(url));
  }, 250);
});
input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); handleGo(); } });
btnClear.addEventListener("click", () => {
  hardReset();
});
btnGo.addEventListener("click", handleGo);
btnEmbedClose.addEventListener("click", hardReset);
window.addEventListener("load", () => input.focus());
</script>
</body>
