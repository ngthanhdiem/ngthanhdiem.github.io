<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Máy tính - Calculator</title>
<style>
:root {
  --bg: #0a0e17;
  --card: #131a2a;
  --card-2: #1a2236;
  --border: #212b42;
  --border-2: #2d3954;
  --text: #e6edf7;
  --text-2: #8b98b3;
  --text-3: #5a6683;
  --accent: #3b82f6;
  --accent-2: #6366f1;
  --green: #10b981;
  --red: #ef4444;
  --orange: #f59e0b;
  --yellow: #eab308;
  --key: #1e2740;
  --key-hover: #29344f;
  --key-op: #2a3a5c;
  --key-op-hover: #3a4d75;
  --key-fn: #252e47;
  --key-fn-hover: #313d5c;
  --key-eq: linear-gradient(135deg, #3b82f6, #6366f1);
  --key-clear: linear-gradient(135deg, #ef4444, #dc2626);
  --key-num: #1e2740;
  --key-num-hover: #29344f;
  --key-mem: #2c1e3d;
  --key-mem-hover: #3a2a52;
  --key-casino-op: linear-gradient(135deg, #f59e0b, #ef4444);
  --key-casino-eq: linear-gradient(135deg, #10b981, #059669);
}
[data-theme="light"] {
  --bg: #f5f7fb;
  --card: #ffffff;
  --card-2: #f8fafc;
  --border: #e2e8f0;
  --border-2: #cbd5e1;
  --text: #0f172a;
  --text-2: #64748b;
  --text-3: #94a3b8;
  --accent: #2563eb;
  --accent-2: #4f46e5;
  --green: #059669;
  --red: #dc2626;
  --orange: #d97706;
  --yellow: #ca8a04;
  --key: #f1f5f9;
  --key-hover: #e2e8f0;
  --key-op: #dbeafe;
  --key-op-hover: #bfdbfe;
  --key-fn: #e2e8f0;
  --key-fn-hover: #cbd5e1;
  --key-num: #f1f5f9;
  --key-num-hover: #e2e8f0;
  --key-mem: #ede9fe;
  --key-mem-hover: #ddd6fe;
}
* {
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
body {
  background: var(--bg);
  background-image:
    radial-gradient(circle at 0% 0%, rgba(59,130,246,0.08), transparent 40%),
    radial-gradient(circle at 100% 100%, rgba(99,102,241,0.08), transparent 40%);
  min-height: 100vh;
  margin: 0;
  padding: 16px;
  color: var(--text);
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.nav {
  position: fixed; top: 16px; left: 16px; right: 16px;
  display: flex; justify-content: space-between; align-items: center;
  z-index: 100; pointer-events: none;
}
.nav > * { pointer-events: auto; }
.nav-left, .nav-right { display: flex; gap: 8px; }
.nav-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 14px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text-2);
  text-decoration: none;
  font-size: 0.82rem; font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}
.nav-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-1px);
}
.nav-btn svg { width: 14px; height: 14px; }
.nav-btn.icon-only { padding: 9px; width: 36px; justify-content: center; }
.nav-btn.icon-only svg { width: 16px; height: 16px; }

.app {
  width: 100%;
  max-width: 400px;
  margin-top: 50px;
}

.mode-tabs {
  display: flex;
  gap: 4px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 12px;
}
.mode-tab {
  flex: 1;
  padding: 10px 12px;
  background: transparent;
  border: none;
  border-radius: 8px;
  color: var(--text-2);
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.mode-tab:hover { color: var(--text); }
.mode-tab.active {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: white;
  box-shadow: 0 4px 12px rgba(59,130,246,0.35);
}

.calc {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 18px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  transition: background 0.3s, border-color 0.3s;
}

.display {
  background: var(--card-2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px 20px 16px;
  margin-bottom: 14px;
  min-height: 130px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: flex-end;
  overflow: hidden;
  position: relative;
}
.display .history {
  font-size: 0.95rem;
  color: var(--text-3);
  font-family: 'SF Mono', ui-monospace, monospace;
  min-height: 22px;
  width: 100%;
  text-align: right;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  direction: rtl;
  margin-bottom: 4px;
  transition: color 0.2s;
}
.display .current {
  font-size: 2.6rem;
  font-weight: 700;
  color: var(--text);
  font-family: 'SF Mono', ui-monospace, monospace;
  letter-spacing: -0.02em;
  width: 100%;
  text-align: right;
  white-space: nowrap;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
  line-height: 1.15;
  transition: font-size 0.15s ease;
}
.display .current::-webkit-scrollbar { display: none; }
.display .current.small { font-size: 2rem; }
.display .current.tiny { font-size: 1.5rem; }

.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.68rem;
  color: var(--text-3);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 10px;
  padding: 0 4px;
  min-height: 14px;
}
.status-bar .mode {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.status-bar .mode-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 6px var(--green);
}
.status-bar .mode-dot.casino {
  background: var(--yellow);
  box-shadow: 0 0 6px var(--yellow);
}
.status-bar .mem {
  color: var(--orange);
}
.status-bar .gt-label {
  color: var(--green);
}

.keys {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.key {
  border: none;
  border-radius: 14px;
  background: var(--key);
  color: var(--text);
  font-size: 1.35rem;
  font-weight: 600;
  padding: 18px 0;
  cursor: pointer;
  transition: all 0.12s ease;
  user-select: none;
  font-family: inherit;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 60px;
  position: relative;
}
.key:hover {
  background: var(--key-hover);
  transform: translateY(-1px);
}
.key:active {
  transform: translateY(0) scale(0.97);
}
.key.op {
  background: var(--key-op);
  color: var(--accent);
  font-size: 1.5rem;
}
.key.op:hover { background: var(--key-op-hover); }
.key.op.active {
  background: var(--accent);
  color: white;
  box-shadow: 0 0 20px rgba(59,130,246,0.5);
}
.key.fn {
  background: var(--key-fn);
  color: var(--text-2);
  font-size: 1.05rem;
}
.key.fn:hover {
  background: var(--key-fn-hover);
  color: var(--text);
}
.key.clear {
  background: var(--key-clear);
  color: white;
  font-size: 1.05rem;
  font-weight: 700;
}
.key.clear:hover { filter: brightness(1.1); }
.key.equals {
  background: var(--key-eq);
  color: white;
  font-size: 1.5rem;
  font-weight: 700;
}
.key.equals:hover {
  filter: brightness(1.1);
  box-shadow: 0 8px 24px rgba(59,130,246,0.5);
}

/* Casino mode */
.keys.casino {
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
.keys.casino .key {
  padding: 14px 0;
  min-height: 52px;
  font-size: 1.2rem;
  border-radius: 10px;
}
.keys.casino .key.num {
  background: var(--key-num);
  color: var(--text);
  font-weight: 700;
}
.keys.casino .key.num:hover { background: var(--key-num-hover); }
.keys.casino .key.mem {
  background: var(--key-mem);
  color: #c4b5fd;
  font-size: 0.85rem;
  font-weight: 700;
}
[data-theme="light"] .keys.casino .key.mem { color: #7c3aed; }
.keys.casino .key.mem:hover { background: var(--key-mem-hover); }
.keys.casino .key.mem.active {
  background: #8b5cf6;
  color: white;
  box-shadow: 0 0 12px rgba(139,92,246,0.6);
}
.keys.casino .key.op {
  background: var(--key-casino-op);
  color: white;
  font-size: 1.3rem;
  font-weight: 700;
}
.keys.casino .key.op:hover { filter: brightness(1.1); }
.keys.casino .key.equals {
  background: var(--key-casino-eq);
  color: white;
  font-size: 1.4rem;
}
.keys.casino .key.equals:hover {
  filter: brightness(1.1);
  box-shadow: 0 8px 24px rgba(16,185,129,0.5);
}
.keys.casino .key.fn {
  background: var(--key-fn);
  color: var(--text-2);
  font-size: 0.85rem;
  font-weight: 700;
}
.keys.casino .key.fn:hover {
  background: var(--key-fn-hover);
  color: var(--text);
}
.keys.casino .key.clear {
  background: var(--key-clear);
  color: white;
  font-size: 0.95rem;
}
.keys.casino .key.wide {
  grid-column: span 2;
}

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--card);
  border: 1px solid var(--green);
  color: var(--green);
  padding: 10px 20px;
  border-radius: 10px;
  font-size: 0.82rem;
  font-weight: 500;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  opacity: 0;
  transition: all 0.25s;
  z-index: 2000;
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.error { border-color: var(--red); color: var(--red); }
.toast.gt { border-color: var(--green); color: var(--green); }

.footer {
  margin-top: 24px;
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  padding-bottom: 20px;
  max-width: 400px;
  width: 100%;
}
.footer a {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 14px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text-2);
  text-decoration: none;
  font-size: 0.78rem; font-weight: 500;
  transition: all 0.2s;
}
.footer a:hover {
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-1px);
}
.footer a.tg:hover { border-color: #229ED9; color: #229ED9; }
.footer a svg { width: 14px; height: 14px; }

@media (max-width: 480px) {
  body { padding: 12px; }
  .nav { top: 12px; left: 12px; right: 12px; }
  .nav-btn span { display: none; }
  .nav-btn { padding: 9px; width: 36px; justify-content: center; }
  .nav-btn svg { width: 16px; height: 16px; }
  .app { margin-top: 56px; }
  .calc { padding: 14px; border-radius: 20px; }
  .display { padding: 16px; min-height: 110px; }
  .display .current { font-size: 2.2rem; }
  .key { padding: 14px 0; font-size: 1.2rem; min-height: 54px; }
  .key.op { font-size: 1.35rem; }
  .keys.casino .key { padding: 11px 0; min-height: 46px; font-size: 1.05rem; }
}
</style>

<script>
(function() {
  'use strict';

  const state = {
    current: '0',
    previous: null,
    operator: null,
    waitingForOperand: false,
    history: '',
    memory: 0,
    grandTotal: 0,
    gtCount: 0,
    lastResult: null,
    justEvaluated: false,
    mode: 'basic'
  };

  const els = {
    current: document.getElementById('current'),
    history: document.getElementById('history'),
    memLabel: document.getElementById('memLabel'),
    gtLabel: document.getElementById('gtLabel'),
    modeLabel: document.getElementById('modeLabel'),
    modeDot: document.getElementById('modeDot'),
    tabBasic: document.getElementById('tabBasic'),
    tabCasino: document.getElementById('tabCasino'),
    basicKeys: document.getElementById('basicKeys'),
    casinoKeys: document.getElementById('casinoKeys'),
    toast: document.getElementById('toast')
  };

  let toastTimer = null;
  function showToast(msg, type) {
    els.toast.textContent = msg;
    els.toast.className = 'toast show';
    if (type) els.toast.classList.add(type);
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.remove('show'), 1500);
  }

  function formatNumber(num) {
    if (!isFinite(num)) return num > 0 ? 'Vô cực' : '-Vô cực';
    if (isNaN(num)) return 'Lỗi';
    const abs = Math.abs(num);
    if (abs !== 0 && (abs >= 1e12 || abs < 1e-9)) {
      return num.toExponential(8).replace(/\.?0+e/, 'e');
    }
    let s = String(num);
    if (s.includes('.')) {
      s = s.replace(/\.?0+$/, '');
    }
    return s;
  }

  function getDisplayValue() {
    if (state.current === '' || state.current === '-') return state.current || '0';
    return state.current;
  }

  function updateDisplay() {
    let val = getDisplayValue();
    if (val.length > 12) val = val.slice(0, 12);

    els.current.textContent = val;
    els.history.textContent = state.history;

    const el = els.current;
    el.classList.remove('small', 'tiny');
    const len = val.length;
    if (len > 14) el.classList.add('tiny');
    else if (len > 10) el.classList.add('small');

    els.memLabel.textContent = state.memory !== 0 ? 'M' : '';
    els.gtLabel.textContent = state.grandTotal !== 0 ? 'GT' : '';

    document.querySelectorAll('.key.op').forEach(k => {
      k.classList.toggle('active', k.dataset.op === state.operator && state.waitingForOperand);
    });
  }

  function inputDigit(digit) {
    if (state.justEvaluated) {
      state.current = '0';
      state.history = '';
      state.previous = null;
      state.operator = null;
      state.justEvaluated = false;
    }

    if (state.waitingForOperand) {
      state.current = digit;
      state.waitingForOperand = false;
    } else {
      if (digit === '00') {
        if (state.current === '0') {
          state.current = '0';
        } else {
          state.current += '00';
        }
      } else if (state.current === '0') {
        state.current = digit;
      } else if (state.current === '-0') {
        state.current = '-' + digit;
      } else {
        if (state.current.replace('-', '').replace('.', '').length >= 15) return;
        state.current += digit;
      }
    }
    updateDisplay();
  }

  function inputDot() {
    if (state.justEvaluated) {
      state.current = '0';
      state.history = '';
      state.previous = null;
      state.operator = null;
      state.justEvaluated = false;
    }

    if (state.waitingForOperand) {
      state.current = '0.';
      state.waitingForOperand = false;
    } else if (!state.current.includes('.')) {
      state.current += '.';
    }
    updateDisplay();
  }

  function performOperation(a, b, op) {
    switch (op) {
      case '+': return a + b;
      case '−': return a - b;
      case '×': return a * b;
      case '÷': return b === 0 ? NaN : a / b;
      default: return b;
    }
  }

  function handleOperator(op) {
    if (state.justEvaluated) {
      state.justEvaluated = false;
    }

    const inputValue = parseFloat(state.current);

    if (state.previous === null) {
      state.previous = inputValue;
    } else if (state.operator && !state.waitingForOperand) {
      const result = performOperation(state.previous, inputValue, state.operator);
      if (isNaN(result)) {
        showError();
        return;
      }
      state.previous = result;
      state.current = formatNumber(result);
    }

    state.waitingForOperand = true;
    state.operator = op;

    const displayPrev = formatNumber(state.previous);
    state.history = displayPrev + ' ' + op;
    updateDisplay();
  }

  function handleEquals() {
    if (state.operator === null || state.previous === null) {
      state.justEvaluated = true;
      state.history = '';
      updateDisplay();
      return;
    }

    const inputValue = parseFloat(state.current);
    const result = performOperation(state.previous, inputValue, state.operator);
    if (isNaN(result)) {
      showError();
      return;
    }

    // Casino mode: tự động cộng vào GT sau dấu =
    if (state.mode === 'casino') {
      state.grandTotal += result;
      state.gtCount++;
    }

    state.history = formatNumber(state.previous) + ' ' + state.operator + ' ' + formatNumber(inputValue) + ' =';
    state.current = formatNumber(result);
    state.previous = null;
    state.operator = null;
    state.waitingForOperand = false;
    state.justEvaluated = true;
    state.lastResult = result;
    updateDisplay();
  }

  function handleClear() {
    state.current = '0';
    state.previous = null;
    state.operator = null;
    state.waitingForOperand = false;
    state.justEvaluated = false;
    state.history = '';
    updateDisplay();
  }

  function handleBackspace() {
    if (state.waitingForOperand || state.justEvaluated) return;
    if (state.current.length <= 1 || (state.current.length === 2 && state.current[0] === '-')) {
      state.current = '0';
    } else {
      state.current = state.current.slice(0, -1);
    }
    updateDisplay();
  }

  function handleSign() {
    if (state.current === '0' || state.current === '') return;
    if (state.current.startsWith('-')) {
      state.current = state.current.slice(1);
    } else {
      state.current = '-' + state.current;
    }
    updateDisplay();
  }

  function handlePercent() {
    const val = parseFloat(state.current);
    if (state.previous !== null && state.operator) {
      const result = state.previous * val / 100;
      state.current = formatNumber(result);
    } else {
      state.current = formatNumber(val / 100);
    }
    state.waitingForOperand = false;
    updateDisplay();
  }

  // ============ MEMORY ============
  function handleMemory(action) {
    const val = parseFloat(state.current) || 0;
    switch (action) {
      case 'MC':
        state.memory = 0;
        showToast('Đã xoá bộ nhớ');
        break;
      case 'MR':
        state.current = formatNumber(state.memory);
        state.waitingForOperand = false;
        state.justEvaluated = false;
        showToast('Đã lấy từ bộ nhớ');
        break;
      case 'M+':
        state.memory += val;
        state.justEvaluated = true;
        showToast('M+ = ' + formatNumber(state.memory));
        break;
      case 'M-':
        state.memory -= val;
        state.justEvaluated = true;
        showToast('M- = ' + formatNumber(state.memory));
        break;
    }
    updateDisplay();
  }

  // ============ CASINO FUNCTIONS ============
  function handleCasino(action) {
    const val = parseFloat(state.current) || 0;
    switch (action) {
      case 'sqrt':
        if (val < 0) { showError(); return; }
        state.history = '√(' + formatNumber(val) + ') =';
        state.current = formatNumber(Math.sqrt(val));
        state.waitingForOperand = false;
        state.justEvaluated = true;
        break;
      case 'percent':
        handlePercent();
        return;
      case 'sign':
        handleSign();
        return;
      case 'gt':
        if (state.grandTotal === 0 && state.gtCount === 0) {
          showToast('Chưa có GT');
        } else {
          state.current = formatNumber(state.grandTotal);
          state.history = 'GT (' + state.gtCount + ' lần) =';
          state.waitingForOperand = false;
          state.justEvaluated = true;
          showToast('Tổng tích luỹ: ' + formatNumber(state.grandTotal), 'gt');
        }
        break;
      case 'mu':
        // MU (markup): nhập giá vốn, bấm ÷, nhập % lợi nhuận, bấm MU → ra giá bán
        // Đơn giản hơn: nhập A, bấm MU → A / (1 - 0.2) = giá có 20% markup
        // Hoặc: nếu đang có phép chia với previous thì tính
        if (state.previous !== null && state.operator === '÷') {
          // Giá vốn / (1 - %/100) - đây là cách hiểu MU phổ biến
          const pct = val;
          if (pct >= 100) { showError(); return; }
          const cost = state.previous;
          const sellPrice = cost / (1 - pct / 100);
          state.history = 'MU: ' + formatNumber(cost) + ' ÷ (1 - ' + pct + '%) =';
          state.current = formatNumber(sellPrice);
          state.previous = null;
          state.operator = null;
          state.waitingForOperand = false;
          state.justEvaluated = true;
        } else {
          // Nhập % markup → tính giá bán = 100/(1-pct)
          const pct = val;
          if (pct >= 100) { showError(); return; }
          state.current = formatNumber(100 / (1 - pct / 100));
          state.history = '100 ÷ (1 - ' + pct + '%) =';
          state.waitingForOperand = false;
          state.justEvaluated = true;
        }
        break;
    }
    updateDisplay();
  }

  function showError() {
    state.current = 'Lỗi';
    state.history = '';
    state.previous = null;
    state.operator = null;
    state.waitingForOperand = false;
    state.justEvaluated = true;
    updateDisplay();
  }

  // ============ EVENT BINDING ============
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;

    // Mode tabs
    if (btn.id === 'tabBasic' || btn.id === 'tabCasino') {
      switchMode(btn.dataset.mode);
      return;
    }

    if (state.current === 'Lỗi' && !btn.dataset.action && !btn.dataset.num) {
      handleClear();
    }

    // Memory
    if (btn.dataset.mem) {
      handleMemory(btn.dataset.mem);
      return;
    }

    // Casino functions
    if (btn.dataset.casino) {
      handleCasino(btn.dataset.casino);
      return;
    }

    // Numbers
    if (btn.dataset.num !== undefined) {
      if (btn.dataset.num === '.') inputDot();
      else inputDigit(btn.dataset.num);
      return;
    }

    // Operators
    if (btn.dataset.op) {
      handleOperator(btn.dataset.op);
      return;
    }

    // Actions
    switch (btn.dataset.action) {
      case 'clear': handleClear(); break;
      case 'sign': handleSign(); break;
      case 'percent': handlePercent(); break;
      case 'back': handleBackspace(); break;
      case 'equals': handleEquals(); break;
    }
  });

  function switchMode(mode) {
    state.mode = mode;
    els.tabBasic.classList.toggle('active', mode === 'basic');
    els.tabCasino.classList.toggle('active', mode === 'casino');
    els.basicKeys.style.display = mode === 'basic' ? 'block' : 'none';
    els.casinoKeys.style.display = mode === 'casino' ? 'block' : 'none';
    els.modeLabel.textContent = mode === 'basic' ? 'Cơ bản' : 'Casino';
    els.modeDot.classList.toggle('casino', mode === 'casino');
    // Đổi nút C/AC trong cả 2 mode
    document.querySelectorAll('[data-action="clear"]').forEach(b => {
      b.textContent = (state.current === '0' && !state.previous && !state.operator) ? 'AC' : 'C';
    });
  }

  // Keyboard
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    const k = e.key;

    if (/^[0-9]$/.test(k)) { e.preventDefault(); inputDigit(k); return; }

    switch (k) {
      case '.':
      case ',':
        e.preventDefault();
        inputDot();
        break;
      case '+':
        e.preventDefault();
        handleOperator('+');
        break;
      case '-':
        e.preventDefault();
        handleOperator('−');
        break;
      case '*':
      case 'x':
      case 'X':
        e.preventDefault();
        handleOperator('×');
        break;
      case '/':
        e.preventDefault();
        handleOperator('÷');
        break;
      case 'Enter':
      case '=':
        e.preventDefault();
        handleEquals();
        break;
      case 'Backspace':
        e.preventDefault();
        handleBackspace();
        break;
      case 'Escape':
      case 'Delete':
        e.preventDefault();
        handleClear();
        break;
      case '%':
        e.preventDefault();
        handlePercent();
        break;
    }
  });

  // Theme
  const THEME_KEY = 'calculator_theme_v1';
  const savedTheme = localStorage.getItem(THEME_KEY) || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon(savedTheme);

  function updateThemeIcon(theme) {
    const icon = document.getElementById('themeIcon');
    if (theme === 'dark') {
      icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/>';
    } else {
      icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/>';
    }
  }
  document.getElementById('themeToggle').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    updateThemeIcon(next);
    localStorage.setItem(THEME_KEY, next);
  });

  updateDisplay();
})();
</script>
</body>
</html>
