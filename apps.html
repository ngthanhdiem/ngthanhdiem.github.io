<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Tiện ích</title>
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/jpeg" href="thanhdiem.jpg">
    <link rel="apple-touch-icon" sizes="180x180" href="thanhdiem.jpg">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="application-name" content="Apps">
    <style>
        :root {
            --bg: #000000;
            --bg-2: #0a0a0a;
            --card: #0d0d0d;
            --card-hover: #141414;
            --border: #1f1f1f;
            --border-hover: #2a2a2a;
            --text: #ffffff;
            --text-2: #a0a0a0;
            --text-3: #666666;
        }
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
        }
        body {
            background: var(--bg);
            display: flex;
            flex-direction: column;
        }
        .hub-header {
            padding: 18px 20px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
            flex-shrink: 0;
            padding-top: calc(18px + env(safe-area-inset-top, 0px));
        }
        .hub-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .hub-brand-mark {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000000;
        }
        .hub-brand-mark svg {
            width: 20px;
            height: 20px;
        }
        .hub-title {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin: 0;
            color: #ffffff;
        }
        .hub-subtitle {
            font-size: 0.7rem;
            color: var(--text-3);
            margin-top: 1px;
            letter-spacing: 0.5px;
        }
        .hub-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-2);
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 600;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .hub-home:hover {
            border-color: #ffffff;
            color: #ffffff;
        }
        .hub-home svg {
            width: 14px;
            height: 14px;
        }
        .hub-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            -webkit-overflow-scrolling: touch;
        }
        .hub-section-title {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .hub-section-title::before {
            content: '';
            width: 3px;
            height: 12px;
            border-radius: 2px;
            background: #ffffff;
        }
        .hub-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 10px;
        }
        .hub-app {
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            text-align: left;
            width: 100%;
            overflow: hidden;
            text-decoration: none;
        }
        .hub-app::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 2px;
            background: #ffffff;
            opacity: 0.3;
            transition: all 0.2s ease;
        }
        .hub-app:hover {
            background: var(--card-hover);
            border-color: var(--border-hover);
            transform: translateY(-1px);
        }
        .hub-app:hover::before {
            width: 3px;
            opacity: 1;
        }
        .hub-app:active {
            transform: translateY(0) scale(0.99);
        }
        .hub-app-icon {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: #1a1a1a;
            border: 1px solid var(--border);
            color: #ffffff;
            transition: all 0.2s ease;
        }
        .hub-app:hover .hub-app-icon {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }
        .hub-app-icon svg {
            width: 22px;
            height: 22px;
        }
        .hub-app-info {
            flex: 1;
            min-width: 0;
        }
        .hub-app-name {
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .hub-app-desc {
            font-size: 0.76rem;
            color: var(--text-2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .hub-app-arrow {
            color: var(--text-3);
            flex-shrink: 0;
            transition: all 0.2s ease;
        }
        .hub-app-arrow svg {
            width: 16px;
            height: 16px;
        }
        .hub-app:hover .hub-app-arrow {
            color: #ffffff;
            transform: translateX(3px);
        }
        @media (max-width: 600px) {
            .hub-header { padding: 14px 16px 12px; padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
            .hub-body { padding: 16px; }
            .hub-grid { grid-template-columns: 1fr; }
            .hub-app { padding: 13px; }
            .hub-app-icon { width: 40px; height: 40px; }
            .hub-app-icon svg { width: 20px; height: 20px; }
            .hub-home span { display: none; }
            .hub-home { padding: 8px; width: 36px; justify-content: center; }
        }
    </style>
</head>
